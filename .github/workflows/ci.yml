name: CI

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

  deploy-to-production:
    needs: check
    runs-on: ubuntu-latest
    if: github.base_ref == 'main'
    environment: production

    steps:
      - name: Approved for production
        run: echo "Manual approval granted, Railway will deploy automatically"